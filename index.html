<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePayUZB - Official Top Up Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">
            <span class="brand-red">GamePay</span><span class="brand-dark">UZB</span>
        </div>
        <div class="user-region">🇺🇿 UZB | UZS</div>
    </header>

    <!-- Banner -->
    <div class="hero-banner">
        <h2>GAMEPAYUZB TOP UP CENTER</h2>
        <p>Rasmiy va Tezkor O'yin Valyutalari Dükoni</p>
    </div>

    <main class="main-container">

        <!-- 1. Select Game -->
        <section class="section-container">
            <h2 class="section-title">1. O'yinni tanlang</h2>
            <div class="game-select-grid">
                <div id="game-ff" class="game-card active" onclick="selectGame('ff')">
                    <img src="https://img.icons8.com/color/96/free-fire.png" alt="Free Fire">
                    <span>Free Fire</span>
                </div>
                <div id="game-pubg" class="game-card" onclick="selectGame('pubg')">
                    <img src="https://img.icons8.com/color/96/pubg.png" alt="PUBG Mobile">
                    <span>PUBG Mobile</span>
                </div>
            </div>
        </section>

        <!-- 2. Enter Player ID -->
        <section class="section-container">
            <h2 class="section-title">2. Player ID kiriting</h2>
            <div class="id-input-box">
                <input type="text" id="player-id" placeholder="Masalan: 9775793347">
                <button type="button" class="check-btn" onclick="requestCheckId()">Check ID</button>
            </div>
            <div id="nickname-status" class="status-box"></div>
        </section>

        <!-- 3. Select Package -->
        <section class="section-container">
            <h2 class="section-title">3. Paketni tanlang</h2>
            <div id="package-container" class="package-grid">
                <!-- Paketlar va rasmlar JS'dan keladi -->
            </div>
        </section>

    </main>

    <!-- Checkout Bar (Pastki qism) -->
    <div class="checkout-bar">
        <div class="selected-summary">
            <span id="selected-item-display">100 Diamant</span>
            <strong id="selected-price-display">13,000 UZS</strong>
        </div>
        <button type="button" class="buy-now-btn" onclick="processOrder()">Buy Now</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
