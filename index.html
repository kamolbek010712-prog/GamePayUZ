<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePayUZB - Official Top Up Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50914">
</head>
<body>

    <!-- Top Navbar -->
    <header class="navbar">
        <div class="logo">
            <span class="brand-red">GamePay</span><span class="brand-dark">UZB</span>
            <span class="divider">|</span>
            <span class="site-title">Official Top Up Center</span>
        </div>
        <div class="user-region">UZB | UZS</div>
    </header>

    <!-- Hero Banner -->
    <div class="hero-banner">
        <h2>GAMEPAYUZB TOP UP CENTER</h2>
        <p>100% Safe & Secure Payment</p>
    </div>

    <main class="main-container">

        <!-- 1. Game Selection -->
        <section class="section-container">
            <h2>1. Select Game</h2>
            <div class="game-select-grid">
                <button type="button" id="game-ff" class="game-btn active" onclick="selectGame('ff')">Free Fire</button>
                <button type="button" id="game-pubg" class="game-btn" onclick="selectGame('pubg')">PUBG Mobile</button>
            </div>
        </section>

        <!-- 2. Login (Player ID) -->
       <!-- 2. Login (Player ID) -->
        <section class="section-container">
            <h2>2. Enter Player ID</h2>
            <div class="input-group" style="display: flex; gap: 10px;">
                <input type="text" id="player-id" placeholder="Enter Player ID (e.g. 123456789)" style="flex: 1;">
                <button type="button" onclick="checkPlayerId()" style="background: #e50914; color: white; border: none; padding: 0 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Check ID</button>
            </div>
            <!-- Nickname shu yerda chiqadi -->
            <div id="nickname-status" style="margin-top: 8px; font-size: 14px; font-weight: bold;"></div>
        </section>

        <!-- 3. Top-up Packages -->
        <section class="section-container">
            <h2>3. Select Package</h2>
            <div id="package-container" class="package-grid">
                <!-- Paketlar JS orqali avtomatik keladi -->
            </div>
        </section>

    </main>

    <!-- Footer Checkout Bar -->
    <div class="checkout-bar">
        <div class="selected-summary">
            <span id="selected-item-display">100 Diamant</span>
            <strong id="selected-price-display">13,000 UZS</strong>
        </div>
        <button type="button" class="buy-now-btn" onclick="processOrder()">Buy Now</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
